<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LekThik is a Trello-style board for teams, built to prove that ZamSync, an offline-first sync engine, can be added to a finished app without rebuilding it."
    />
    <title>LekThik</title>
    <script>
      // Applies the saved appearance before the first paint so there is no flash
      // of the wrong theme. Mirrors lib/appearance.ts, keep the two in step.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('lekthik.appearance.v1') || 'null') || {};
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var more = window.matchMedia('(prefers-contrast: more)').matches;
          var theme = saved.theme;
          if (theme !== 'light' && theme !== 'dark' && theme !== 'contrast') {
            theme = more ? 'contrast' : dark ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.density = saved.density || 'comfortable';
          root.dataset.text = saved.text_size || 'normal';
          root.dataset.motion = saved.motion || 'system';
          root.dataset.cvd = saved.color_vision || 'standard';
          root.dataset.font = saved.reading_font || 'standard';
          root.dataset.spacing = saved.letter_spacing || 'normal';
          if (saved.label_shapes) root.dataset.shapes = 'on';
          if (saved.strong_focus) root.dataset.focus = 'strong';
          if (saved.large_targets) root.dataset.targets = 'large';
          if (saved.flat_backgrounds) root.dataset.flat = 'on';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
