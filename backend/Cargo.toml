[workspace]
resolver = "3"
members = ["domain", "application", "adapters/http", "adapters/db"]

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8.9"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid"] }
async-trait = "0.1.92"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
argon2 = "0.6.0"
validator = { version = "0.21.0", features = ["derive"] }
mockall = "0.15.0"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "rust_crypto"] }
secrecy = "0.10.3"
